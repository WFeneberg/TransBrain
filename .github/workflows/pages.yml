name: Deploy GitHub Pages

# Publishes the project landing page (site/) to GitHub Pages by force-pushing the staged
# site to the gh-pages branch (Pages source: "Deploy from a branch", enabled automatically
# when gh-pages was first created — the repo token may not call the Pages API, so the
# actions-based deploy path is not available). The screenshots are not duplicated into
# site/ — this workflow copies docs/img into the branch at img/, which is the path
# site/index.html references them under.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/img/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage site with screenshots from docs/img
        run: |
          mkdir -p _site/img
          cp -r site/. _site/
          cp -r docs/img/. _site/img/
          touch _site/.nojekyll
      - name: Push to gh-pages
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: publish site from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
