name: Deploy GitHub Pages

# Publishes the project landing page (site/) to GitHub Pages. The screenshots are not
# duplicated into site/ — this workflow copies docs/img into the artifact at img/, which
# is the path site/index.html references them under.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/img/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site with screenshots from docs/img
        run: |
          mkdir -p _site/img
          cp -r site/. _site/
          cp -r docs/img/. _site/img/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
