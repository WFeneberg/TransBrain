name: CI

# NOTE: Playwright end-to-end tests (src/TransBrain.Web/e2e, src/TransBrain.VueWeb/e2e) are
# deliberately NOT run here. They need the full Aspire stack up — API, Postgres, Redis and,
# critically, Keycloak for the OIDC login flow — and there is no headless startup path for
# that stack yet. This is a known gap, not an oversight: e2e tests are run locally against
# `dotnet run --project src/TransBrain.AppHost` for now, and get a CI job once a headless
# Aspire startup exists.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore TransBrain.slnx
      - run: dotnet build TransBrain.slnx --no-restore
      - run: dotnet test tests/TransBrain.Domain.Tests --no-build
      # Spec §11 sets an 80% line-coverage floor for the Application layer. Measured on
      # 2026-08-28 this suite sits at 86.9% line / 84.7% branch — comfortably above the
      # floor, so the gate below enforces the spec's number, not today's number: raising it
      # to match current coverage would make the gate fail the moment someone adds an
      # untested private helper, which trains people to disable gates rather than write tests.
      - run: >
          dotnet test tests/TransBrain.Application.Tests --no-build
          --collect:"XPlat Code Coverage" --results-directory ./coverage/application
      - name: Application layer coverage gate (line >= 80%)
        run: |
          report=$(find ./coverage/application -name 'coverage.cobertura.xml' | head -1)
          if [ -z "$report" ]; then
            echo "No coverage report found under ./coverage/application" >&2
            exit 1
          fi
          line_rate=$(grep -o 'line-rate="[0-9.]*"' "$report" | head -1 | grep -o '[0-9.]*')
          awk -v rate="$line_rate" 'BEGIN {
            pct = rate * 100
            printf "Application layer line coverage: %.2f%%\n", pct
            exit (rate < 0.80) ? 1 : 0
          }'
      # Testcontainers-backed; ubuntu-latest runners provide a Docker daemon out of the box.
      - run: dotnet test tests/TransBrain.Api.IntegrationTests --no-build

  frontends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [TransBrain.Web, TransBrain.VueWeb]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4'
      - run: npm ci
        working-directory: src/${{ matrix.project }}
      - run: npm run build
        working-directory: src/${{ matrix.project }}
      # TransBrain.Web (Angular) has a unit-test script (`npm run test`, vitest-backed via the
      # @angular/build:unit-test builder) and runs headlessly with --watch=false. TransBrain.VueWeb
      # has no unit-test script today - only its Playwright e2e suite, which needs the full stack
      # and is out of scope for this job (see the note at the top of this file). Deliberately not
      # inventing a Vue unit-test script here; this asymmetry is real, not an oversight.
      - if: matrix.project == 'TransBrain.Web'
        run: npm run test -- --watch=false
        working-directory: src/${{ matrix.project }}
